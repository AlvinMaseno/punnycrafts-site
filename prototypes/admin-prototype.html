<title>Punny Crafts Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: back-office. Brand bar with tabs, summary tiles first, then work lists. Mustard accent, ink neutrals. */
:root{
  --bg:#f7f5ef; --panel:#ffffff; --fg:#1c1a16; --muted:#6b665b; --line:#e4e0d4;
  --accent:#f4b400; --accent-fg:#1c1a16; --ink:#1c1a16; --ink-fg:#f4b400;
  --ok:#1f7a5c; --ok-bg:#dff3ea; --warn:#8a5a00; --warn-bg:#fdeec2; --bad:#b3261e; --bad-bg:#fbe0dd; --info:#255b9e; --info-bg:#dce9fa;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"DM Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --panel:#1e1c16; --fg:#f3f0e6; --muted:#a39e90; --line:#37342a;
  --ink:#f4b400; --ink-fg:#1c1a16;
  --ok:#6fd2ae; --ok-bg:#173a2f; --warn:#f2c35a; --warn-bg:#3d3010; --bad:#ff9b92; --bad-bg:#452020; --info:#8fbdf2; --info-bg:#1c3050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14130f; --panel:#1e1c16; --fg:#f3f0e6; --muted:#a39e90; --line:#37342a;
  --ink:#f4b400; --ink-fg:#1c1a16;
  --ok:#6fd2ae; --ok-bg:#173a2f; --warn:#f2c35a; --warn-bg:#3d3010; --bad:#ff9b92; --bad-bg:#452020; --info:#8fbdf2; --info-bg:#1c3050; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 10px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--accent);color:var(--accent-fg);padding:2px 8px;border-radius:4px;transform:rotate(-2deg);display:inline-block}
.brand small{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .count{background:var(--bad-bg);color:var(--bad);border-radius:999px;font-size:12px;padding:1px 7px;margin-left:6px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.alert{border-color:var(--bad)}
.tile.alert b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 a,.linkbtn{background:none;border:0;color:var(--fg);font-size:13px;font-weight:700;border-bottom:2px solid var(--accent);cursor:pointer;padding:0;font-family:var(--font-body)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:160px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
.toolbar input,.toolbar select{width:auto}
.toolbar input.grow{width:auto}
.btn{background:var(--panel);border:1px solid var(--fg);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{padding:4px 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.sub{color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;line-height:1}
.stepper input{width:58px;text-align:center;padding:5px;font-variant-numeric:tabular-nums}
.lvl{width:64px;text-align:center;padding:5px}
.orders{display:grid;gap:12px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.order header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.order h3{font-size:17px}
.order .items{font-size:14px;margin:0;padding:0;list-style:none;display:grid;gap:2px}
.order .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.track{display:flex;gap:0;overflow-x:auto;padding-block:4px}
.track div{flex:1;min-width:84px;font-size:11px;color:var(--muted);text-align:center;position:relative;padding-top:16px}
.track div::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}
.track div::after{content:"";position:absolute;top:0;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--line);border:2px solid var(--panel)}
.track div.done{color:var(--fg)}
.track div.done::before,.track div.done::after{background:var(--accent)}
.track div.now{font-weight:700}
.track div.now::after{background:var(--ink)}
.track time{display:block;font-weight:400;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:18px;margin-bottom:4px}
.rs{display:grid;gap:10px}
.rs .order .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rs input[type=number]{width:80px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:start center;overflow-y:auto;padding:24px 16px;z-index:20}
.modal{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:560px;display:grid;gap:12px}
.modal h2{font-size:22px}
.modal label{display:grid;gap:4px;font-size:13px;font-weight:700}
.modal fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:grid;gap:10px;min-width:0}
.modal legend{font-weight:700;font-size:13px;padding-inline:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:grid;grid-template-columns:1fr 80px auto;gap:8px}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:90vw}
.locked{max-width:520px;margin:60px auto;text-align:center}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media (max-width:520px){.row2{grid-template-columns:1fr}.addrow{grid-template-columns:1fr 70px auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><i>Punny</i>Crafts <small>Admin</small></div>
    <div class="chips"><button class="btn primary" data-act="new-order" type="button">Log order</button></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <div id="banner"></div>
  <main id="main"><div class="empty"><b>Loading</b>Fetching stock and orders.</div></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
var db=null, S={products:[],orders:[],restocks:[],meta:{},ready:{p:false,o:false,r:false}};
var STATUSES=["New","Confirmed","In production","Ready","Dispatched","Delivered"];
var CHANNELS=["Instagram","WhatsApp","TikTok","Facebook","Walk-in","Phone call"];
var TABS=[["dashboard","Dashboard"],["orders","Orders"],["stock","Stock"],["restocks","Restocks"]];
var view="dashboard", orderFilter="Open", stockQuery="";
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ksh(n){return "KSh "+Number(n||0).toLocaleString("en-KE")}
function when(t){return t?new Date(t).toLocaleString("en-KE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}
function tracked(p){return p.tracked!==false}
function isLow(p){return tracked(p)&&(p.stock||0)<=(p.reorder==null?3:p.reorder)}
function openRestock(sku){return S.restocks.find(function(r){return r.sku===sku&&(r.status==="Requested"||r.status==="Ordered")})}
function prod(sku){return S.products.find(function(p){return p.id===sku})}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toastRoot").appendChild(t);setTimeout(function(){t.remove()},2600)}

/* one write at a time per document */
var chains={};
function q(key,fn){chains[key]=(chains[key]||Promise.resolve()).catch(function(){}).then(fn);return chains[key]}
function bump(sku,delta){return q("p:"+sku,function(){var ref=db.doc("products/"+sku);return ref.get().then(function(s){if(!s.exists)return;var cur=Number(s.data().stock)||0;return ref.update({stock:Math.max(0,cur+delta)})})})}
function fail(e){toast("Could not save: "+((e&&e.message)||"try again"))}

/* ---------- rendering ---------- */
function lowList(){return S.products.filter(isLow).sort(function(a,b){return a.stock-b.stock})}
function openOrders(){return S.orders.filter(function(o){return o.status!=="Delivered"&&o.status!=="Cancelled"})}
function renderTabs(){
  var low=lowList().length;
  $("#tabs").innerHTML=TABS.map(function(t){
    var badge=(t[0]==="stock"&&low)?'<span class="count">'+low+'</span>':'';
    return '<button role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(view===t[0])+'">'+t[1]+badge+'</button>'}).join("");
}
function renderBanner(){
  $("#banner").innerHTML=S.meta.samples?'<div class="banner"><span>Stock counts shown are sample figures. Set your real counts in Stock, then dismiss this.</span><button class="btn small" type="button" data-act="dismiss-samples">Dismiss</button></div>':"";
}
function pillFor(p){
  if(!tracked(p))return '<span class="pill p-mute">Made to order</span>';
  if((p.stock||0)<=0)return '<span class="pill p-bad">Out of stock</span>';
  if(isLow(p))return '<span class="pill p-warn">Replenish</span>';
  return '<span class="pill p-ok">OK</span>';
}
function statusPill(s){var c=s==="Delivered"?"p-ok":s==="Cancelled"?"p-bad":s==="Ready"||s==="Dispatched"?"p-info":"p-warn";return '<span class="pill '+c+'">'+esc(s)+'</span>'}
function restockBtn(p){
  var r=openRestock(p.id);
  if(r)return '<span class="pill p-info">Restock '+esc(r.status.toLowerCase())+'</span>';
  return '<button class="btn small primary" type="button" data-act="restock" data-sku="'+esc(p.id)+'">Restock</button>';
}
function orderCard(o){
  var idx=STATUSES.indexOf(o.status), cancelled=o.status==="Cancelled";
  var hist={};(o.history||[]).forEach(function(h){hist[h.status]=h.at});
  var track=cancelled?'':'<div class="track" aria-label="Order progress">'+STATUSES.map(function(s,i){
    return '<div class="'+(i<=idx?'done':'')+(i===idx?' now':'')+'">'+s+(hist[s]?'<time>'+when(hist[s])+'</time>':'')+'</div>'}).join("")+'</div>';
  var next=STATUSES[idx+1];
  var actions='';
  if(next)actions+='<button class="btn small primary" type="button" data-act="advance" data-id="'+o.id+'">Mark '+esc(next)+'</button>';
  if(!cancelled&&o.status!=="Delivered"&&o.status!=="Dispatched")actions+=' <button class="btn small danger" type="button" data-act="cancel-order" data-id="'+o.id+'">Cancel</button>';
  return '<article class="order"><header><div><h3>'+esc(o.number)+' · '+esc(o.customer)+'</h3><div class="sub">'+esc(o.channel)+(o.ref?' · '+esc(o.ref):'')+(o.phone?' · '+esc(o.phone):'')+' · logged '+when(o.createdAt)+'</div></div>'+statusPill(o.status)+'</header>'+
    '<ul class="items">'+(o.items||[]).map(function(i){return '<li>'+i.qty+' × '+esc(i.name)+' <span class="sub">'+ksh(i.price*i.qty)+'</span></li>'}).join("")+'</ul>'+
    (o.note?'<div class="sub">Note: '+esc(o.note)+'</div>':'')+track+
    '<div class="foot"><b>'+ksh(o.total)+'</b><span>'+actions+'</span></div></article>';
}
function emptyOrders(){return '<div class="empty"><b>No orders yet</b>When someone orders on Instagram, WhatsApp or TikTok, press Log order to record it and reserve the stock.</div>'}

function renderDashboard(){
  var low=lowList(), open=openOrders();
  var ready=S.orders.filter(function(o){return o.status==="Ready"}).length;
  var rs=S.restocks.filter(function(r){return r.status==="Requested"||r.status==="Ordered"}).length;
  var lowRows=low.length?'<div class="tablewrap"><table><thead><tr><th>Product</th><th class="num">Left</th><th class="num">Level</th><th></th></tr></thead><tbody>'+low.map(function(p){
    return '<tr class="low"><td>'+esc(p.name)+'<div class="sub">'+esc(p.category)+'</div></td><td class="num"><b>'+p.stock+'</b></td><td class="num">'+(p.reorder==null?3:p.reorder)+'</td><td>'+restockBtn(p)+'</td></tr>'}).join("")+'</tbody></table></div>'
    :'<div class="empty"><b>Nothing to restock</b>Every tracked product is above its replenish level.</div>';
  var recent=open.slice().sort(function(a,b){return b.createdAt-a.createdAt}).slice(0,4);
  return '<div class="tiles">'+
    '<div class="tile'+(low.length?' alert':'')+'"><b>'+low.length+'</b><span>At or below replenish level</span></div>'+
    '<div class="tile"><b>'+open.length+'</b><span>Open orders</span></div>'+
    '<div class="tile"><b>'+ready+'</b><span>Ready to dispatch</span></div>'+
    '<div class="tile"><b>'+rs+'</b><span>Restocks in progress</span></div></div>'+
    '<div class="cols"><section class="panel"><h2>Low stock <button class="linkbtn" type="button" data-tab="stock">All stock</button></h2>'+lowRows+'</section>'+
    '<section class="panel"><h2>Open orders <button class="linkbtn" type="button" data-tab="orders">All orders</button></h2><div class="orders">'+(recent.length?recent.map(orderCard).join(""):emptyOrders())+'</div></section></div>';
}
function renderOrders(){
  var f=["Open","All"].concat(STATUSES,["Cancelled"]);
  var list=S.orders.slice().sort(function(a,b){return b.createdAt-a.createdAt}).filter(function(o){
    if(orderFilter==="All")return true;
    if(orderFilter==="Open")return o.status!=="Delivered"&&o.status!=="Cancelled";
    return o.status===orderFilter});
  return '<div class="toolbar"><div class="chips" role="group" aria-label="Filter orders">'+f.map(function(s){return '<button class="chip" type="button" data-filter="'+s+'" aria-pressed="'+(orderFilter===s)+'">'+s+'</button>'}).join("")+'</div></div>'+
    '<div class="orders">'+(list.length?list.map(orderCard).join(""):(S.orders.length?'<div class="empty"><b>No orders here</b>Try another filter.</div>':emptyOrders()))+'</div>';
}
function renderStock(){
  var qn=stockQuery.toLowerCase();
  var list=S.products.filter(function(p){return !qn||(p.name+" "+p.category).toLowerCase().indexOf(qn)>-1})
    .sort(function(a,b){return (isLow(b)-isLow(a))||a.category.localeCompare(b.category)||a.name.localeCompare(b.name)});
  var rows=list.map(function(p){
    var t=tracked(p);
    return '<tr class="'+(isLow(p)?'low':'')+'"><td>'+esc(p.name)+'<div class="sub">'+esc(p.category)+' · '+ksh(p.price)+'</div></td>'+
    '<td>'+(t?'<span class="stepper"><button type="button" aria-label="Remove one" data-act="dec" data-sku="'+esc(p.id)+'">−</button><input type="number" min="0" value="'+(p.stock||0)+'" data-set-stock="'+esc(p.id)+'" aria-label="Stock for '+esc(p.name)+'"><button type="button" aria-label="Add one" data-act="inc" data-sku="'+esc(p.id)+'">+</button></span>':'<span class="sub">Not counted</span>')+'</td>'+
    '<td>'+(t?'<input class="lvl" type="number" min="0" value="'+(p.reorder==null?3:p.reorder)+'" data-set-level="'+esc(p.id)+'" aria-label="Replenish level for '+esc(p.name)+'">':'')+'</td>'+
    '<td>'+pillFor(p)+'</td><td>'+(isLow(p)?restockBtn(p):'')+'</td></tr>'}).join("");
  return '<div class="toolbar"><input class="grow" id="stockSearch" type="search" placeholder="Search products" value="'+esc(stockQuery)+'" aria-label="Search products"><button class="btn" type="button" data-act="new-product">Add product</button></div>'+
    '<section class="panel"><div class="tablewrap"><table><thead><tr><th>Product</th><th>In stock</th><th>Replenish at</th><th>Status</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5"><div class="empty"><b>No products</b>Add a product to start tracking stock.</div></td></tr>')+'</tbody></table></div></section>';
}
function renderRestocks(){
  var list=S.restocks.slice().sort(function(a,b){return b.requestedAt-a.requestedAt});
  if(!list.length)return '<div class="empty"><b>No restocks yet</b>Products at or below their replenish level show a Restock button on the Dashboard and Stock tabs.</div>';
  return '<div class="rs">'+list.map(function(r){
    var c=r.status==="Received"?"p-ok":r.status==="Cancelled"?"p-bad":r.status==="Ordered"?"p-info":"p-warn";
    var act='';
    if(r.status==="Requested")act='<button class="btn small primary" type="button" data-act="rs-ordered" data-id="'+r.id+'">Mark ordered</button> <button class="btn small danger" type="button" data-act="rs-cancel" data-id="'+r.id+'">Cancel</button>';
    if(r.status==="Ordered")act='<label class="sub">Received qty <input type="number" min="1" value="'+r.qty+'" id="rq-'+r.id+'"></label> <button class="btn small primary" type="button" data-act="rs-received" data-id="'+r.id+'">Mark received</button> <button class="btn small danger" type="button" data-act="rs-cancel" data-id="'+r.id+'">Cancel</button>';
    return '<article class="order"><header><div><h3>'+esc(r.name)+' · '+r.qty+' pcs</h3><div class="sub">Requested '+when(r.requestedAt)+(r.orderedAt?' · ordered '+when(r.orderedAt):'')+(r.receivedAt?' · received '+when(r.receivedAt):'')+'</div></div><span class="pill '+c+'">'+esc(r.status)+'</span></header>'+(r.note?'<div class="sub">'+esc(r.note)+'</div>':'')+'<div class="row">'+act+'</div></article>'}).join("")+'</div>';
}
function render(){
  if(!(S.ready.p&&S.ready.o&&S.ready.r))return;
  renderTabs();renderBanner();
  var ae=document.activeElement, keep=ae&&ae.id==="stockSearch"?ae.selectionStart:null;
  $("#main").innerHTML=view==="orders"?renderOrders():view==="stock"?renderStock():view==="restocks"?renderRestocks():renderDashboard();
  if(keep!==null){var si=$("#stockSearch");if(si){si.focus();si.setSelectionRange(keep,keep)}}
}

/* ---------- modals ---------- */
function modal(html){
  var root=$("#modalRoot");
  root.innerHTML='<div class="overlay" role="dialog" aria-modal="true"><div class="modal">'+html+'</div></div>';
  root.querySelector(".overlay").addEventListener("mousedown",function(e){if(e.target===this)closeModal()});
  root.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",closeModal)});
  var f=root.querySelector("input,select,textarea");if(f)f.focus();
  return root;
}
function closeModal(){$("#modalRoot").innerHTML=""}
function prodOptions(){return S.products.slice().sort(function(a,b){return a.category.localeCompare(b.category)||a.name.localeCompare(b.name)}).map(function(p){
  return '<option value="'+esc(p.id)+'">'+esc(p.name)+' — '+ksh(p.price)+(tracked(p)?' ('+(p.stock||0)+' in stock)':' (made to order)')+'</option>'}).join("")}

function openOrderModal(){
  var lines=[];
  var root=modal('<h2>Log order</h2><form id="of" style="display:grid;gap:12px">'+
    '<div class="row2"><label>Channel<select id="of-ch">'+CHANNELS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label><label>Customer name<input id="of-name" required></label></div>'+
    '<div class="row2"><label>Phone<input id="of-phone" inputmode="tel" placeholder="07.."></label><label>Handle or chat reference<input id="of-ref" placeholder="@username"></label></div>'+
    '<label>Delivery address and notes<textarea id="of-note" rows="2" placeholder="Name to print, design code, delivery area"></textarea></label>'+
    '<fieldset><legend>Items</legend><div class="addrow"><select id="of-prod" aria-label="Product">'+prodOptions()+'</select><input id="of-qty" type="number" min="1" value="1" aria-label="Quantity"><button class="btn" type="button" id="of-add">Add</button></div><div id="of-lines"></div></fieldset>'+
    '<div class="err" id="of-err" role="alert"></div><div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Log order</button></div></form>');
  function drawLines(){
    var total=0;
    $("#of-lines",root).innerHTML=lines.length?lines.map(function(l,i){var p=prod(l.sku);total+=p.price*l.qty;
      return '<div class="line"><span>'+l.qty+' × '+esc(p.name)+'</span><span>'+ksh(p.price*l.qty)+' <button class="linkbtn" type="button" data-rm="'+i+'">Remove</button></span></div>'}).join("")+'<div class="line"><b>Total</b><b>'+ksh(total)+'</b></div>':'<div class="sub">No items yet.</div>';
  }
  drawLines();
  $("#of-add",root).addEventListener("click",function(){
    var sku=$("#of-prod",root).value, qty=Math.max(1,parseInt($("#of-qty",root).value,10)||1);
    if(!sku)return;
    var ex=lines.find(function(l){return l.sku===sku});if(ex)ex.qty+=qty;else lines.push({sku:sku,qty:qty});
    $("#of-qty",root).value=1;drawLines();
  });
  $("#of-lines",root).addEventListener("click",function(e){var i=e.target.getAttribute("data-rm");if(i!==null){lines.splice(+i,1);drawLines()}});
  $("#of",root).addEventListener("submit",function(e){
    e.preventDefault();
    var err=$("#of-err",root);err.textContent="";
    if(!lines.length){err.textContent="Add at least one item.";return}
    for(var i=0;i<lines.length;i++){var p=prod(lines[i].sku);if(tracked(p)&&lines[i].qty>(p.stock||0)){err.textContent="Only "+(p.stock||0)+" of "+p.name+" in stock. Lower the quantity or restock first.";return}}
    var seq=S.orders.reduce(function(m,o){return Math.max(m,o.seq||0)},0)+1;
    var items=lines.map(function(l){var p=prod(l.sku);return {sku:p.id,name:p.name,qty:l.qty,price:p.price}});
    var total=items.reduce(function(s,i){return s+i.price*i.qty},0), now=Date.now();
    var id="o"+now.toString(36);
    var btn=$("button[type=submit]",root);btn.disabled=true;
    db.doc("orders/"+id).set({seq:seq,number:"PC-"+String(seq).padStart(4,"0"),channel:$("#of-ch",root).value,customer:$("#of-name",root).value.trim(),phone:$("#of-phone",root).value.trim(),ref:$("#of-ref",root).value.trim(),note:$("#of-note",root).value.trim(),items:items,total:total,status:"New",history:[{status:"New",at:now}],createdAt:now})
    .then(function(){return items.reduce(function(chain,i){return prod(i.sku)&&tracked(prod(i.sku))?chain.then(function(){return bump(i.sku,-i.qty)}):chain},Promise.resolve())})
    .then(function(){closeModal();toast("Order logged, stock updated");view="orders";orderFilter="Open";render()})
    .catch(function(e){btn.disabled=false;fail(e)});
  });
}
function openRestockModal(sku){
  var p=prod(sku);if(!p)return;
  var root=modal('<h2>Restock '+esc(p.name)+'</h2><p class="sub" style="margin:0">'+(p.stock||0)+' left, replenish level '+(p.reorder==null?3:p.reorder)+'.</p>'+
    '<form id="rf" style="display:grid;gap:12px"><label>Quantity to order<input id="rf-qty" type="number" min="1" value="10" required></label>'+
    '<label>Supplier or note<input id="rf-note" placeholder="Printer, vendor, design codes"></label><div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Request restock</button></div></form>');
  $("#rf",root).addEventListener("submit",function(e){
    e.preventDefault();var now=Date.now();
    if(openRestock(sku)){closeModal();return}
    db.collection("restocks").add({sku:sku,name:p.name,qty:Math.max(1,parseInt($("#rf-qty",root).value,10)||1),note:$("#rf-note",root).value.trim(),status:"Requested",requestedAt:now})
    .then(function(){closeModal();toast("Restock requested")}).catch(fail);
  });
}
function openProductModal(){
  var root=modal('<h2>Add product</h2><form id="pf" style="display:grid;gap:12px"><label>Name<input id="pf-name" required></label>'+
    '<div class="row2"><label>Category<input id="pf-cat" required placeholder="Papergoods" list="cats"></label><label>Price (KSh)<input id="pf-price" type="number" min="0" required></label></div>'+
    '<datalist id="cats"><option>Papergoods</option><option>Accessories</option><option>Message Jars</option><option>Drinkware</option><option>Books &amp; Stationery</option><option>Apparel &amp; Textiles</option><option>Complimentaries</option><option>Gift Packaging</option></datalist>'+
    '<div class="row2"><label>Starting stock<input id="pf-stock" type="number" min="0" value="0"></label><label>Replenish at<input id="pf-level" type="number" min="0" value="3"></label></div>'+
    '<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="pf-made" type="checkbox" style="width:auto"> Made to order (no stock counted)</label>'+
    '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Add product</button></div></form>');
  $("#pf",root).addEventListener("submit",function(e){
    e.preventDefault();var name=$("#pf-name",root).value.trim();
    var id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+"-"+Date.now().toString(36).slice(-3);
    db.doc("products/"+id).set({name:name,category:$("#pf-cat",root).value.trim(),price:Number($("#pf-price",root).value)||0,stock:Number($("#pf-stock",root).value)||0,reorder:Number($("#pf-level",root).value)||0,tracked:!$("#pf-made",root).checked})
    .then(function(){closeModal();toast("Product added")}).catch(fail);
  });
}

/* ---------- actions ---------- */
function byId(list,id){return list.find(function(x){return x.id===id})}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-filter],[data-act]");if(!t)return;
  var tab=t.getAttribute("data-tab");
  if(tab){view=tab;render();return}
  var flt=t.getAttribute("data-filter");
  if(flt){orderFilter=flt;render();return}
  var act=t.getAttribute("data-act"), id=t.getAttribute("data-id"), sku=t.getAttribute("data-sku");
  if(act==="new-order")openOrderModal();
  else if(act==="new-product")openProductModal();
  else if(act==="restock")openRestockModal(sku);
  else if(act==="inc")bump(sku,1).catch(fail);
  else if(act==="dec")bump(sku,-1).catch(fail);
  else if(act==="dismiss-samples")db.doc("meta/settings").set({samples:false}).catch(fail);
  else if(act==="advance"){var o=byId(S.orders,id);if(!o)return;var nx=STATUSES[STATUSES.indexOf(o.status)+1];if(!nx)return;
    q("o:"+id,function(){return db.doc("orders/"+id).update({status:nx,history:(o.history||[]).concat([{status:nx,at:Date.now()}])})}).then(function(){toast(o.number+" is now "+nx)}).catch(fail)}
  else if(act==="cancel-order"){var c=byId(S.orders,id);if(!c)return;
    if(t.getAttribute("data-sure")!=="1"){t.setAttribute("data-sure","1");t.textContent="Confirm cancel";return}
    q("o:"+id,function(){return db.doc("orders/"+id).update({status:"Cancelled",history:(c.history||[]).concat([{status:"Cancelled",at:Date.now()}])})})
    .then(function(){return (c.items||[]).reduce(function(ch,i){var p=prod(i.sku);return p&&tracked(p)?ch.then(function(){return bump(i.sku,i.qty)}):ch},Promise.resolve())})
    .then(function(){toast(c.number+" cancelled, stock returned")}).catch(fail)}
  else if(act==="rs-ordered"){q("r:"+id,function(){return db.doc("restocks/"+id).update({status:"Ordered",orderedAt:Date.now()})}).catch(fail)}
  else if(act==="rs-cancel"){q("r:"+id,function(){return db.doc("restocks/"+id).update({status:"Cancelled"})}).catch(fail)}
  else if(act==="rs-received"){var r=byId(S.restocks,id);if(!r)return;
    var qty=Math.max(1,parseInt(($("#rq-"+id)||{}).value,10)||r.qty);
    q("r:"+id,function(){return db.doc("restocks/"+id).update({status:"Received",receivedAt:Date.now(),receivedQty:qty})})
    .then(function(){return bump(r.sku,qty)}).then(function(){toast(qty+" added to "+r.name)}).catch(fail)}
});
document.addEventListener("input",function(e){if(e.target.id==="stockSearch"){stockQuery=e.target.value;render()}});
document.addEventListener("change",function(e){
  var s=e.target.getAttribute("data-set-stock"), l=e.target.getAttribute("data-set-level");
  if(s){var v=Math.max(0,parseInt(e.target.value,10)||0);q("p:"+s,function(){return db.doc("products/"+s).update({stock:v})}).catch(fail)}
  if(l){var w=Math.max(0,parseInt(e.target.value,10)||0);q("p:"+l,function(){return db.doc("products/"+l).update({reorder:w})}).catch(fail)}
});
window.addEventListener("hashchange",route);
function route(){var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h}))view=h;render()}
document.addEventListener("click",function(e){var t=e.target.closest("[data-tab]");if(t){try{history.replaceState(null,"","#"+t.getAttribute("data-tab"))}catch(x){}}});

/* ---------- boot ---------- */
function locked(msg){$("#main").innerHTML='<div class="empty locked"><b>Admin access needed</b>'+msg+'</div>';$("#tabs").innerHTML="";$(".top .chips").innerHTML=""}
function snap(col,key,flag){
  return db.collection(col).onSnapshot(function(s){S[key]=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});S.ready[flag]=true;render()},function(){locked("This page could not read the shared database for your account.")});
}
function start(){
  var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h}))view=h;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    db=r[0];var user=r[1];
    if(!db){locked("Open this page while signed in to Claude. Only people with edit access can use it.");return}
    return (user?user.canEdit():Promise.resolve(false)).then(function(ok){
      if(!ok){locked("Only the owner and people given edit access can view stock and orders.");return}
      snap("products","products","p");snap("orders","orders","o");snap("restocks","restocks","r");
      db.doc("meta/settings").onSnapshot(function(s){S.meta=s.exists?s.data():{};render()},function(){});
    });
  }).catch(function(){locked("Could not start. Reload the page.")});
}
start();
})();
</script>
